name: Ternforge release
description: Run the shared Ternforge Release Please flow from an environment-protected caller job.

inputs:
  app-client-id:
    description: Public client ID for the Ternforge Release GitHub App.
    required: true
  app-private-key:
    description: Private key for the Ternforge Release GitHub App.
    required: true
  synchronize-python-lock:
    description: Update uv.lock in the Release PR branch after a version change.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Create current-repository release token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Verify exact release-token scope
      shell: bash
      env:
        EXPECTED_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        mapfile -t repositories < <(
          gh api installation/repositories --paginate --jq '.repositories[].full_name'
        )
        test "${#repositories[@]}" -eq 1
        test "${repositories[0]}" = "$EXPECTED_REPOSITORY"

    - name: Create or update the Release Please pull request
      id: release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

    - name: Check out the Python Release PR branch
      if: inputs.synchronize-python-lock == 'true' && steps.release-please.outputs.prs_created == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
        persist-credentials: false
        fetch-depth: 0

    - name: Set up uv
      if: inputs.synchronize-python-lock == 'true' && steps.release-please.outputs.prs_created == 'true'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version-file: pyproject.toml
        enable-cache: false

    - name: Synchronize the Python Release PR lockfile
      if: inputs.synchronize-python-lock == 'true' && steps.release-please.outputs.prs_created == 'true'
      shell: bash
      env:
        RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        uv lock
        if git diff --quiet -- uv.lock; then
          exit 0
        fi
        test "$(git diff --name-only)" = "uv.lock"
        git config user.name "Ternforge Release"
        git config user.email "313545885+ternforge-release[bot]@users.noreply.github.com"
        git add uv.lock
        git commit -m "chore: synchronize release lockfile"
        auth_header="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')"
        printf '::add-mask::%s\n' "$auth_header"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push origin HEAD

    - name: Create update-dispatch token
      id: dispatch-token
      if: steps.release-please.outputs.release_created == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ternforge-infra-updates
        permission-contents: write

    - name: Verify exact dispatch-token scope
      if: steps.release-please.outputs.release_created == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
      run: |
        set -euo pipefail
        mapfile -t repositories < <(
          gh api installation/repositories --paginate --jq '.repositories[].full_name'
        )
        test "${#repositories[@]}" -eq 1
        test "${repositories[0]}" = "betabitplus/ternforge-infra-updates"

    - name: Dispatch released state to full-fleet reconciliation
      if: steps.release-please.outputs.release_created == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        SOURCE_REF: refs/tags/${{ steps.release-please.outputs.tag_name }}
        SOURCE_REPOSITORY: ${{ github.repository }}
        SOURCE_SHA: ${{ steps.release-please.outputs.sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        jq -n \
          --arg source_repository "$SOURCE_REPOSITORY" \
          --arg source_ref "$SOURCE_REF" \
          --arg source_sha "$SOURCE_SHA" \
          '{
            event_type: "ternforge-release",
            client_payload: {
              source_repository: $source_repository,
              source_ref: $source_ref,
              source_sha: $source_sha
            }
          }' > "$RUNNER_TEMP/repository-dispatch.json"
        test "$(jq -r '.client_payload | keys | join(",")' "$RUNNER_TEMP/repository-dispatch.json")" = "source_ref,source_repository,source_sha"
        gh api \
          --method POST \
          repos/betabitplus/ternforge-infra-updates/dispatches \
          --input "$RUNNER_TEMP/repository-dispatch.json"
