name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: ci / required
    # Lightweight repository validation uses the container-backed runner pool.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Validate workflows with actionlint
        env:
          GOTOOLCHAIN: local
          # renovate: datasource=github-releases depName=rhysd/actionlint versioning=semver extractVersion=^v(?<version>.*)$
          ACTIONLINT_VERSION: 1.7.12
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"

      - name: Audit privileged workflows with zizmor
        env:
          # renovate: datasource=pypi depName=zizmor versioning=pep440
          ZIZMOR_VERSION: 1.29.0
        run: >-
          uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor
          .github/actions/release/action.yml
          .github/workflows/release-caller.yml

      - name: Verify repository files
        run: |
          set -euo pipefail
          git diff --check
          bash -n bin/ternforge-local-ci
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
