name: reusable python library docs

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the locked project environment.
        required: true
        type: string
      package-name:
        description: Importable top-level package name whose facade and _api tree define the public Python API.
        required: true
        type: string
      live-mode:
        description: release builds automatically on relevant releases; manual only reports drift until workflow_dispatch.
        required: false
        type: string
        default: release
      docs-runner:
        description: Runner label used for live documentation execution.
        required: false
        type: string
        default: ubuntu-24.04
      playwright-browsers:
        description: Optional space-separated Playwright install targets required by live examples.
        required: false
        type: string
        default: ""
      local-environment:
        description: Load the repository's trusted direnv environment before live execution.
        required: false
        type: boolean
        default: false
      target-ref:
        description: Release tag to publish. Empty resolves to the repository's latest GitHub release.
        required: false
        type: string
        default: ""
      force:
        description: Rebuild even when the published source already covers all relevant changes.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: Private key for the Ternforge read-only source GitHub App used to authenticate private dependency Git access.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      build-needed: ${{ steps.plan.outputs.build-needed }}
      target-ref: ${{ steps.plan.outputs.target-ref }}
      target-sha: ${{ steps.plan.outputs.target-sha }}
      environment-sha256: ${{ steps.plan.outputs.environment-sha256 }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Decide whether published docs are stale
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          TARGET_REF_INPUT: ${{ inputs.target-ref }}
        run: |
          set -euo pipefail

          target_ref="$TARGET_REF_INPUT"
          if [[ -z "$target_ref" ]]; then
            target_ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          target_ref="${target_ref#refs/tags/}"
          target_sha="$(git rev-parse "refs/tags/$target_ref^{commit}")"

          published_sha=""
          published_environment_sha256=""
          pages_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          if [[ -n "$pages_url" ]]; then
            metadata="$(curl -fsSL --max-time 10 "${pages_url%/}/ternforge-docs.json?run=$GITHUB_RUN_ID" 2>/dev/null || true)"
            if [[ -n "$metadata" ]] && jq -e . >/dev/null 2>&1 <<<"$metadata"; then
              published_sha="$(jq -r '.source_sha // empty' <<<"$metadata")"
              published_environment_sha256="$(jq -r '.environment_sha256 // empty' <<<"$metadata")"
            fi
          fi

          build_needed=false
          environment_sha256=""
          reason="published docs already cover the relevant surface"
          if [[ "$FORCE" == true ]]; then
            build_needed=true
            reason="forced by workflow dispatch"
          elif [[ -z "$published_sha" ]]; then
            build_needed=true
            reason="no published Ternforge docs metadata exists"
          elif ! git cat-file -e "$published_sha^{commit}" 2>/dev/null; then
            build_needed=true
            reason="published source commit is not available in repository history"
          else
            relevant_paths=(
              docs
              examples
              "src/$PACKAGE_NAME/__init__.py"
              "src/$PACKAGE_NAME/_api"
            )
            specifications_present=false
            if git ls-tree -r --name-only "$target_sha" -- features | grep -qE '[.]feature$'; then
              specifications_present=true
              relevant_paths+=(
                features
                "src/$PACKAGE_NAME"
                tests/conftest.py
                "tests/$PACKAGE_NAME/conftest.py"
                "tests/$PACKAGE_NAME/bdd"
                "tests/$PACKAGE_NAME/data"
                "tests/$PACKAGE_NAME/support"
              )
            fi
            mapfile -t changed < <(
              git diff --name-only "$published_sha" "$target_sha" -- "${relevant_paths[@]}"
            )
            if (( ${#changed[@]} > 0 )); then
              build_needed=true
              reason="relevant docs/examples/public-API/specification source changed"
              printf 'Relevant changes since %s:\n' "$published_sha"
              printf '  %s\n' "${changed[@]}"
            fi

            if [[ "$build_needed" == false ]]; then
              pyproject_changed="$(
                python3 -c 'import subprocess, sys, tomllib; a = tomllib.loads(subprocess.check_output(["git", "show", f"{sys.argv[1]}:pyproject.toml"], text=True)); b = tomllib.loads(subprocess.check_output(["git", "show", f"{sys.argv[2]}:pyproject.toml"], text=True)); a.get("project", {}).pop("version", None); b.get("project", {}).pop("version", None); print("true" if a != b else "false")' \
                  "$published_sha" "$target_sha"
              )"
              if [[ "$pyproject_changed" == true ]]; then
                build_needed=true
                reason="project configuration changed"
              fi
            fi

            if [[ "$build_needed" == false ]]; then
              target_worktree="$RUNNER_TEMP/ternforge-docs-target"
              rm -rf "$target_worktree"
              git worktree add --detach "$target_worktree" "$target_sha" >/dev/null
              export_groups=(--group docs)
              if [[ "$specifications_present" == true ]]; then
                export_groups+=(--group specifications)
              fi
              environment_sha256="$(
                uv export \
                  --project "$target_worktree" \
                  --frozen \
                  --no-dev \
                  "${export_groups[@]}" \
                  --no-hashes \
                  --no-header \
                  --no-annotate \
                  --no-emit-project \
                  --python "$PYTHON_VERSION" \
                | LC_ALL=C sort \
                | shasum -a 256 \
                | cut -d' ' -f1
              )"
              git worktree remove --force "$target_worktree"

              if [[ -z "$published_environment_sha256" ]]; then
                build_needed=true
                reason="published docs metadata predates dependency-environment fingerprinting"
              elif [[ "$published_environment_sha256" != "$environment_sha256" ]]; then
                build_needed=true
                reason="runtime/docs/specifications dependency environment changed"
              fi
            fi
          fi

          {
            echo "target-ref=$target_ref"
            echo "target-sha=$target_sha"
            echo "build-needed=$build_needed"
            echo "environment-sha256=$environment_sha256"
          } >> "$GITHUB_OUTPUT"

          printf 'Target release: %s (%s)\n' "$target_ref" "$target_sha"
          printf 'Published source: %s\n' "${published_sha:-none}"
          printf 'Published environment: %s\n' "${published_environment_sha256:-none}"
          printf 'Target environment: %s\n' "${environment_sha256:-not-needed}"
          printf 'Decision: %s (%s)\n' "$build_needed" "$reason"

      - name: Report manual publication requirement
        if: ${{ steps.plan.outputs.build-needed == 'true' && inputs.live-mode == 'manual' && github.event_name != 'workflow_dispatch' }}
        run: echo '::warning::Live documentation is stale for this release. Run the Docs workflow manually when the required local services are available.'

  build:
    name: live build
    needs: plan
    if: ${{ needs.plan.outputs.build-needed == 'true' && (inputs.live-mode == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ inputs.docs-runner }}
    steps:
      - name: Check out exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Set up Node for Allure
        if: ${{ hashFiles('features/**/*.feature') != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Synchronize the locked environment
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          sync_args=(--locked --no-dev --group docs --python "$PYTHON_VERSION")
          if find features -type f -name '*.feature' -print -quit 2>/dev/null | grep -q .; then
            sync_args+=(--group specifications)
          fi
          uv sync "${sync_args[@]}"

      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          set -euo pipefail
          read -r -a browsers <<<"$PLAYWRIGHT_BROWSERS"
          uv run --no-sync playwright install --with-deps "${browsers[@]}"

      - name: Build live Sphinx-Gallery documentation
        env:
          LOCAL_ENVIRONMENT: ${{ inputs.local-environment }}
          SPHINX_ENABLE_INTERSPHINX: "1"
        run: |
          set -euo pipefail
          rm -rf docs/_build docs/auto_examples docs/generated docs/sg_execution_times.rst test-results/sphinx-gallery
          output="$RUNNER_TEMP/docs-html"
          rm -rf "$output"

          build=(uv run --no-sync sphinx-build -W --keep-going -b html docs "$output")
          if [[ "$LOCAL_ENVIRONMENT" == true ]]; then
            command -v direnv >/dev/null
            direnv allow .
            direnv exec . env SPHINX_ENABLE_INTERSPHINX=1 "${build[@]}"
          else
            "${build[@]}"
          fi

      - name: Replay living specifications
        id: specifications
        if: ${{ hashFiles('features/**/*.feature') != '' }}
        env:
          ALLURE_RESULTS_DIR: ${{ runner.temp }}/allure-results
        run: |
          set -euo pipefail
          rm -rf "$ALLURE_RESULTS_DIR"
          uv run --no-sync pytest \
            -o addopts= \
            --strict-markers \
            tests/*/bdd \
            -m specification \
            --record-mode=none \
            --block-network \
            --alluredir="$ALLURE_RESULTS_DIR"

      - name: Write living specifications launch metadata
        if: ${{ steps.specifications.outcome == 'success' }}
        env:
          ALLURE_RESULTS_DIR: ${{ runner.temp }}/allure-results
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ needs.plan.outputs.target-ref }}
          TARGET_SHA: ${{ needs.plan.outputs.target-sha }}
        run: |
          set -euo pipefail
          pages_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          export PAGES_URL="$pages_url"
          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          from pathlib import Path

          results = Path(os.environ["ALLURE_RESULTS_DIR"])
          results.mkdir(parents=True, exist_ok=True)
          environment = {
              "Repository": os.environ["GITHUB_REPOSITORY"],
              "Release": os.environ["TARGET_REF"],
              "Source-SHA": os.environ["TARGET_SHA"],
              "Python": platform.python_version(),
              "OS": platform.platform(),
              "Evidence-mode": "VCR replay",
              "Network": "blocked",
          }
          results.joinpath("environment.properties").write_text(
              "".join(f"{key} = {value}\n" for key, value in environment.items()),
              encoding="utf-8",
          )

          server_url = os.environ["GITHUB_SERVER_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          pages_url = os.environ.get("PAGES_URL", "").rstrip("/")
          executor = {
              "name": "GitHub Actions",
              "type": "github",
              "buildName": f"Run #{run_number}",
              "buildOrder": run_number,
              "buildUrl": f"{server_url}/{repository}/actions/runs/{run_id}",
          }
          if pages_url:
              executor["reportUrl"] = f"{pages_url}/specifications/"
          results.joinpath("executor.json").write_text(
              json.dumps(executor, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Apply living specifications quality gate
        if: ${{ always() && steps.specifications.outcome != 'skipped' }}
        env:
          ALLURE_RESULTS_DIR: ${{ runner.temp }}/allure-results
          # renovate: datasource=npm depName=allure
          ALLURE_VERSION: 3.15.0
        run: >-
          npx --yes "allure@${ALLURE_VERSION}" quality-gate
          "$ALLURE_RESULTS_DIR"
          --cwd "$RUNNER_TEMP"
          --max-failures 0
          --min-tests-count 1
          --success-rate 1

      - name: Build living specifications report
        if: ${{ steps.specifications.outcome == 'success' }}
        env:
          ALLURE_RESULTS_DIR: ${{ runner.temp }}/allure-results
          ALLURE_REPORT_DIR: ${{ runner.temp }}/allure-report
          DOCS_OUTPUT_DIR: ${{ runner.temp }}/docs-html
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=npm depName=allure
          ALLURE_VERSION: 3.15.0
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/specifications-history.jsonl"
          rm -f "$history"
          pages_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          if [[ -n "$pages_url" ]]; then
            curl -fsSL --max-time 10 \
              "${pages_url%/}/specifications/history.jsonl?run=$GITHUB_RUN_ID" \
              -o "$history" 2>/dev/null || rm -f "$history"
          fi

          rm -rf "$ALLURE_REPORT_DIR"
          npx --yes "allure@${ALLURE_VERSION}" awesome \
            "$ALLURE_RESULTS_DIR" \
            --output "$ALLURE_REPORT_DIR" \
            --history-path "$history" \
            --report-name "Living Specifications" \
            --group-by feature \
            --hide-labels framework \
            --hide-labels language \
            --hide-labels host \
            --hide-labels thread \
            --hide-labels tag

          specifications_dir="$DOCS_OUTPUT_DIR/specifications"
          rm -rf "$specifications_dir"
          mkdir -p "$specifications_dir"
          cp -R "$ALLURE_REPORT_DIR"/. "$specifications_dir"/
          cp "$history" "$specifications_dir/history.jsonl"

      - name: Upload living specifications evidence
        if: ${{ always() && steps.specifications.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: living-specifications-allure-results-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Write immutable docs source metadata
        env:
          ENVIRONMENT_SHA256: ${{ needs.plan.outputs.environment-sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/docs-html
          PYTHON_VERSION: ${{ inputs.python-version }}
          TARGET_REF: ${{ needs.plan.outputs.target-ref }}
          TARGET_SHA: ${{ needs.plan.outputs.target-sha }}
        run: |
          if [[ -z "$ENVIRONMENT_SHA256" ]]; then
            export_groups=(--group docs)
            if find features -type f -name '*.feature' -print -quit 2>/dev/null | grep -q .; then
              export_groups+=(--group specifications)
            fi
            ENVIRONMENT_SHA256="$(
              uv export \
                --frozen \
                --no-dev \
                "${export_groups[@]}" \
                --no-hashes \
                --no-header \
                --no-annotate \
                --no-emit-project \
                --python "$PYTHON_VERSION" \
              | LC_ALL=C sort \
              | shasum -a 256 \
              | cut -d' ' -f1
            )"
            export ENVIRONMENT_SHA256
          fi

          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["TARGET_REF"],
              "source_sha": os.environ["TARGET_SHA"],
              "environment_sha256": os.environ["ENVIRONMENT_SHA256"],
              "built_at": datetime.now(UTC).isoformat(),
              "live_examples": True,
              "living_specifications": (
                  Path(os.environ["OUTPUT_DIR"]) / "specifications" / "index.html"
              ).is_file(),
          }
          target = Path(os.environ["OUTPUT_DIR"]) / "ternforge-docs.json"
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Detect Sphinx-Gallery JUnit evidence
        id: junit
        run: |
          if [[ -s "$RUNNER_TEMP/test-results/sphinx-gallery/junit.xml" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Sphinx-Gallery JUnit evidence
        if: ${{ steps.junit.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sphinx-gallery-junit-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/test-results/sphinx-gallery/junit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload rendered documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ternforge-docs-html
          path: ${{ runner.temp }}/docs-html
          if-no-files-found: error
          retention-days: 1

  package:
    name: package Pages artifact
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download rendered documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternforge-docs-html
          path: ${{ runner.temp }}/docs-html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/docs-html

  deploy:
    name: deploy
    needs: [plan, package]
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
