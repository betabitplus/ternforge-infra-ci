name: reusable python library docs

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the locked project environment.
        required: true
        type: string
      package-name:
        description: Importable top-level package name whose facade and _api tree define the public Python API.
        required: true
        type: string
      live-mode:
        description: release builds automatically on relevant releases; manual only reports drift until workflow_dispatch.
        required: false
        type: string
        default: release
      docs-runner:
        description: Runner label used for live documentation execution.
        required: false
        type: string
        default: ubuntu-24.04
      playwright-browsers:
        description: Optional space-separated Playwright install targets required by live examples.
        required: false
        type: string
        default: ""
      local-environment:
        description: Load the repository's trusted direnv environment before live execution.
        required: false
        type: boolean
        default: false
      release-dossier:
        description: Build release-dossier.pdf from the exact release documentation and publish it with Pages.
        required: false
        type: boolean
        default: false
      target-ref:
        description: Release tag to publish. Empty resolves to the repository's latest GitHub release.
        required: false
        type: string
        default: ""
      force:
        description: Rebuild even when the published source already covers all relevant changes.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: Private key for the Ternforge read-only source GitHub App used to authenticate private dependency Git access.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      build-needed: ${{ steps.plan.outputs.build-needed }}
      target-ref: ${{ steps.plan.outputs.target-ref }}
      target-sha: ${{ steps.plan.outputs.target-sha }}
      environment-sha256: ${{ steps.plan.outputs.environment-sha256 }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Decide whether published docs are stale
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          TARGET_REF_INPUT: ${{ inputs.target-ref }}
        run: |
          set -euo pipefail

          target_ref="$TARGET_REF_INPUT"
          if [[ -z "$target_ref" ]]; then
            target_ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          target_ref="${target_ref#refs/tags/}"
          target_sha="$(git rev-parse "refs/tags/$target_ref^{commit}")"

          published_sha=""
          published_environment_sha256=""
          pages_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          if [[ -n "$pages_url" ]]; then
            metadata="$(curl -fsSL --max-time 10 "${pages_url%/}/ternforge-docs.json?run=$GITHUB_RUN_ID" 2>/dev/null || true)"
            if [[ -n "$metadata" ]] && jq -e . >/dev/null 2>&1 <<<"$metadata"; then
              published_sha="$(jq -r '.source_sha // empty' <<<"$metadata")"
              published_environment_sha256="$(jq -r '.environment_sha256 // empty' <<<"$metadata")"
            fi
          fi

          build_needed=false
          environment_sha256=""
          reason="published docs already cover the relevant surface"
          if [[ "$FORCE" == true ]]; then
            build_needed=true
            reason="forced by workflow dispatch"
          elif [[ -z "$published_sha" ]]; then
            build_needed=true
            reason="no published Ternforge docs metadata exists"
          elif ! git cat-file -e "$published_sha^{commit}" 2>/dev/null; then
            build_needed=true
            reason="published source commit is not available in repository history"
          else
            relevant_paths=(
              docs
              examples
              features
              tests
              "src/$PACKAGE_NAME"
              ubproject.toml
            )
            mapfile -t changed < <(
              git diff --name-only "$published_sha" "$target_sha" -- "${relevant_paths[@]}"
            )
            if (( ${#changed[@]} > 0 )); then
              build_needed=true
              reason="relevant docs/examples/public-API source changed"
              printf 'Relevant changes since %s:\n' "$published_sha"
              printf '  %s\n' "${changed[@]}"
            fi

            if [[ "$build_needed" == false ]]; then
              pyproject_changed="$(
                python3 -c 'import subprocess, sys, tomllib; a = tomllib.loads(subprocess.check_output(["git", "show", f"{sys.argv[1]}:pyproject.toml"], text=True)); b = tomllib.loads(subprocess.check_output(["git", "show", f"{sys.argv[2]}:pyproject.toml"], text=True)); a.get("project", {}).pop("version", None); b.get("project", {}).pop("version", None); print("true" if a != b else "false")' \
                  "$published_sha" "$target_sha"
              )"
              if [[ "$pyproject_changed" == true ]]; then
                build_needed=true
                reason="project configuration changed"
              fi
            fi

            if [[ "$build_needed" == false ]]; then
              target_worktree="$RUNNER_TEMP/ternforge-docs-target"
              rm -rf "$target_worktree"
              git worktree add --detach "$target_worktree" "$target_sha" >/dev/null
              environment_sha256="$(
                uv export \
                  --project "$target_worktree" \
                  --frozen \
                  --all-groups \
                  --no-hashes \
                  --no-header \
                  --no-annotate \
                  --no-emit-project \
                  --python "$PYTHON_VERSION" \
                | LC_ALL=C sort \
                | shasum -a 256 \
                | cut -d' ' -f1
              )"
              git worktree remove --force "$target_worktree"

              if [[ -z "$published_environment_sha256" ]]; then
                build_needed=true
                reason="published docs metadata predates dependency-environment fingerprinting"
              elif [[ "$published_environment_sha256" != "$environment_sha256" ]]; then
                build_needed=true
                reason="runtime/docs dependency environment changed"
              fi
            fi
          fi

          {
            echo "target-ref=$target_ref"
            echo "target-sha=$target_sha"
            echo "build-needed=$build_needed"
            echo "environment-sha256=$environment_sha256"
          } >> "$GITHUB_OUTPUT"

          printf 'Target release: %s (%s)\n' "$target_ref" "$target_sha"
          printf 'Published source: %s\n' "${published_sha:-none}"
          printf 'Published environment: %s\n' "${published_environment_sha256:-none}"
          printf 'Target environment: %s\n' "${environment_sha256:-not-needed}"
          printf 'Decision: %s (%s)\n' "$build_needed" "$reason"

      - name: Report manual publication requirement
        if: ${{ steps.plan.outputs.build-needed == 'true' && inputs.live-mode == 'manual' && github.event_name != 'workflow_dispatch' }}
        run: echo '::warning::Live documentation is stale for this release. Run the Docs workflow manually when the required local services are available.'

  build:
    name: live build
    needs: plan
    if: ${{ needs.plan.outputs.build-needed == 'true' && (inputs.live-mode == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ inputs.docs-runner }}
    steps:
      - name: Check out exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Synchronize the locked environment
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          uv sync --locked --all-groups --python "$PYTHON_VERSION"

      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          set -euo pipefail
          read -r -a browsers <<<"$PLAYWRIGHT_BROWSERS"
          uv run --no-sync playwright install --with-deps "${browsers[@]}"

      - name: Test release and collect evidence
        env:
          COVERAGE_FILE: ${{ runner.temp }}/ternforge-evidence/.coverage
          EVIDENCE_DIR: ${{ runner.temp }}/ternforge-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/allure-results"

          status=0
          uv run --no-sync pytest \
            -c pyproject.toml \
            -n 2 \
            --record-mode=none \
            --block-network \
            --allowed-hosts='localhost,127\.0\.0\.1' \
            --junitxml "$EVIDENCE_DIR/pytest-junit.xml" \
            --alluredir "$EVIDENCE_DIR/allure-results" \
            --cov-context=test || status=$?

          if [[ -f "$COVERAGE_FILE" ]]; then
            uv run --no-sync coverage json \
              --show-contexts \
              -o "$EVIDENCE_DIR/coverage.json"
          fi

          if [[ "$status" -eq 0 ]]; then
            test -s "$EVIDENCE_DIR/pytest-junit.xml"
            test -f "$COVERAGE_FILE"
            test -s "$EVIDENCE_DIR/coverage.json"
          fi
          exit "$status"

      - name: Upload release test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-test-evidence-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/ternforge-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Build live Sphinx-Gallery documentation
        env:
          LOCAL_ENVIRONMENT: ${{ inputs.local-environment }}
          SPHINX_ENABLE_INTERSPHINX: "1"
        run: |
          set -euo pipefail
          rm -rf docs/_build docs/auto_examples docs/generated docs/sg_execution_times.rst test-results/sphinx-gallery
          output="$RUNNER_TEMP/docs-html"
          rm -rf "$output"

          trace_source="docs/ci-pytest-evidence.rst"
          trace_junit="docs/_traceability/ci-pytest.xml"
          mkdir -p docs/_traceability
          cp "$RUNNER_TEMP/ternforge-evidence/pytest-junit.xml" "$trace_junit"
          cat >"$trace_source" <<'RST'
          :orphan:

          CI pytest evidence
          ==================

          .. test-file:: Pytest CI evidence
             :id: PYTEST_CI_EVIDENCE
             :file: _traceability/ci-pytest.xml
             :auto_suites:
             :auto_cases:
          RST
          trap 'rm -f "$trace_source" "$trace_junit"' EXIT

          build=(uv run --no-sync sphinx-build -W --keep-going -b html docs "$output")
          if [[ "$LOCAL_ENVIRONMENT" == true ]]; then
            command -v direnv >/dev/null
            direnv allow .
            direnv exec . env SPHINX_ENABLE_INTERSPHINX=1 "${build[@]}"
          else
            "${build[@]}"
          fi

      - name: Write immutable docs source metadata
        env:
          ENVIRONMENT_SHA256: ${{ needs.plan.outputs.environment-sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/docs-html
          PYTHON_VERSION: ${{ inputs.python-version }}
          RELEASE_DOSSIER: ${{ inputs.release-dossier }}
          TARGET_REF: ${{ needs.plan.outputs.target-ref }}
          TARGET_SHA: ${{ needs.plan.outputs.target-sha }}
        run: |
          if [[ -z "$ENVIRONMENT_SHA256" ]]; then
            ENVIRONMENT_SHA256="$(
              uv export \
                --frozen \
                --all-groups \
                --no-hashes \
                --no-header \
                --no-annotate \
                --no-emit-project \
                --python "$PYTHON_VERSION" \
              | LC_ALL=C sort \
              | shasum -a 256 \
              | cut -d' ' -f1
            )"
            export ENVIRONMENT_SHA256
          fi

          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["TARGET_REF"],
              "source_sha": os.environ["TARGET_SHA"],
              "environment_sha256": os.environ["ENVIRONMENT_SHA256"],
              "built_at": datetime.now(UTC).isoformat(),
              "live_examples": True,
              "release_dossier": os.environ["RELEASE_DOSSIER"] == "true",
          }
          target = Path(os.environ["OUTPUT_DIR"]) / "ternforge-docs.json"
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Detect Sphinx-Gallery JUnit evidence
        id: junit
        run: |
          if [[ -s "$RUNNER_TEMP/test-results/sphinx-gallery/junit.xml" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Sphinx-Gallery JUnit evidence
        if: ${{ steps.junit.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sphinx-gallery-junit-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/test-results/sphinx-gallery/junit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload rendered documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ternforge-docs-html
          path: ${{ runner.temp }}/docs-html
          if-no-files-found: error
          retention-days: 1

  dossier:
    name: release dossier
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' && inputs.release-dossier }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Synchronize the locked environment
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          uv sync --locked --all-groups --python "$PYTHON_VERSION"

      - name: Download release test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-evidence-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/ternforge-evidence

      - name: Build release dossier from exact evidence
        env:
          SPHINX_ENABLE_INTERSPHINX: "1"
        run: |
          set -euo pipefail
          rm -rf docs/_build docs/auto_examples docs/generated docs/sg_execution_times.rst
          pdf_output="$RUNNER_TEMP/docs-pdf"
          rm -rf "$pdf_output"

          trace_source="docs/ci-pytest-evidence.rst"
          trace_junit="docs/_traceability/ci-pytest.xml"
          mkdir -p docs/_traceability
          cp "$RUNNER_TEMP/ternforge-evidence/pytest-junit.xml" "$trace_junit"
          cat >"$trace_source" <<'RST'
          :orphan:

          CI pytest evidence
          ==================

          .. test-file:: Pytest CI evidence
             :id: PYTEST_CI_EVIDENCE
             :file: _traceability/ci-pytest.xml
             :auto_suites:
             :auto_cases:
          RST
          trap 'rm -f "$trace_source" "$trace_junit"' EXIT

          uv run --no-sync sphinx-build \
            -W \
            --keep-going \
            -D plot_gallery=0 \
            -D llms_txt_enabled=0 \
            -b simplepdf \
            docs \
            "$pdf_output"
          test -s "$pdf_output/release-dossier.pdf"

      - name: Upload release dossier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dossier-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/docs-pdf/release-dossier.pdf
          if-no-files-found: error
          retention-days: 30

  package:
    name: package Pages artifact
    needs: [plan, build, dossier]
    if: ${{ always() && needs.build.result == 'success' && (inputs.release-dossier == false || needs.dossier.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download rendered documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternforge-docs-html
          path: ${{ runner.temp }}/docs-html

      - name: Download release dossier
        if: ${{ inputs.release-dossier }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dossier-${{ needs.plan.outputs.target-ref }}
          path: ${{ runner.temp }}/docs-pdf

      - name: Add release dossier to Pages bundle
        if: ${{ inputs.release-dossier }}
        run: cp "$RUNNER_TEMP/docs-pdf/release-dossier.pdf" "$RUNNER_TEMP/docs-html/release-dossier.pdf"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/docs-html

  deploy:
    name: deploy
    needs: [plan, package]
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
