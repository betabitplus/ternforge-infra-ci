name: reusable release

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the repository-scoped Release GitHub App.
        required: true
        type: string
      repository:
        description: Current repository name without the owner prefix.
        required: true
        type: string
      release-type:
        description: Release Please release type.
        required: true
        type: string
      synchronize-python-lock:
        description: Update uv.lock in the Release PR branch after a version change.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: Private key for the repository-scoped Release GitHub App.
        required: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Create current-repository release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify exact release-token scope
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t repositories < <(
            gh api installation/repositories --paginate --jq '.repositories[].full_name'
          )
          test "${#repositories[@]}" -eq 1
          test "${repositories[0]}" = "$EXPECTED_REPOSITORY"

      - name: Create or update the Release Please pull request
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the Python Release PR branch
        if: inputs.synchronize-python-lock && steps.release-please.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        if: inputs.synchronize-python-lock && steps.release-please.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Synchronize the Python Release PR lockfile
        if: inputs.synchronize-python-lock && steps.release-please.outputs.prs_created == 'true'
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          test "$(git diff --name-only)" = "uv.lock"
          git config user.name "Ternforge Release"
          git config user.email "313545885+ternforge-release[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: synchronize release lockfile"
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push origin HEAD
