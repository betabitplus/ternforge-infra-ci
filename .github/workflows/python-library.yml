name: reusable python library ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the locked project environment.
        required: true
        type: string
      runtime-audit-exclude-package:
        description: Optional unhashed internal VCS project excluded from the frozen runtime export.
        required: false
        type: string
        default: ""
      runtime-audit-ignore-vulnerabilities:
        description: Optional space-separated exact vulnerability IDs accepted by the calling repository.
        required: false
        type: string
        default: ""
      playwright-browsers:
        description: Optional space-separated Playwright install targets validated by the locked Playwright CLI.
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key for the Ternforge read-only source GitHub App used to authenticate private dependency Git access.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: required
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml

      - name: Create read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Synchronize the locked environment once
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uv sync --locked --all-groups --python "$PYTHON_VERSION"

      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          set -euo pipefail
          read -r -a browsers <<<"$PLAYWRIGHT_BROWSERS"
          uv run --no-sync playwright install --with-deps "${browsers[@]}"

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Type checks
        run: |
          set -euo pipefail
          uv run --no-sync ty check
          uv run --no-sync pyright

      - name: Import and Ternforge policy
        run: |
          set -euo pipefail
          uv run --no-sync lint-imports
          uv run --no-sync py-lib-policy check

      - name: Complexity, security, documentation, and dependency checks
        run: |
          set -euo pipefail
          uv run --no-sync flake8 src tests
          radon_cc="$(uv run --no-sync radon cc --show-complexity --min C src)"
          if [[ -n "$radon_cc" ]]; then
            printf '%s\n' "$radon_cc"
            exit 1
          fi
          radon_mi="$(uv run --no-sync radon mi --show --min B src)"
          if [[ -n "$radon_mi" ]]; then
            printf '%s\n' "$radon_mi"
            exit 1
          fi
          uv run --no-sync bandit --recursive src
          uv run --no-sync interrogate --fail-under 100 src
          uv run --no-sync deptry .

      - name: Test and collect evidence
        env:
          COVERAGE_FILE: ${{ runner.temp }}/ternforge-evidence/.coverage
          EVIDENCE_DIR: ${{ runner.temp }}/ternforge-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/allure-results"

          status=0
          uv run --no-sync pytest \
            -c pyproject.toml \
            -n 2 \
            --junitxml "$EVIDENCE_DIR/pytest-junit.xml" \
            --alluredir "$EVIDENCE_DIR/allure-results" \
            --cov-context=test || status=$?

          if [[ -f "$COVERAGE_FILE" ]]; then
            uv run --no-sync coverage json \
              --show-contexts \
              -o "$EVIDENCE_DIR/coverage.json"
          fi

          if [[ "$status" -eq 0 ]]; then
            test -s "$EVIDENCE_DIR/pytest-junit.xml"
            test -f "$COVERAGE_FILE"
            test -s "$EVIDENCE_DIR/coverage.json"
          fi
          exit "$status"

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-test-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ternforge-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Build documentation without live example execution
        if: ${{ hashFiles('docs/conf.py') != '' }}
        run: |
          set -euo pipefail
          trace_source="docs/ci-pytest-evidence.rst"
          trace_junit="docs/_traceability/ci-pytest.xml"
          mkdir -p docs/_traceability
          cp "$RUNNER_TEMP/ternforge-evidence/pytest-junit.xml" "$trace_junit"
          cat >"$trace_source" <<'RST'
          :orphan:

          CI pytest evidence
          ==================

          .. test-file:: Pytest CI evidence
             :id: PYTEST_CI_EVIDENCE
             :file: _traceability/ci-pytest.xml
             :auto_suites:
             :auto_cases:
          RST
          trap 'rm -f "$trace_source" "$trace_junit"' EXIT

          uv run --no-sync sphinx-build \
            -W \
            --keep-going \
            -D plot_gallery=0 \
            -b html \
            docs \
            "$RUNNER_TEMP/docs-html"

      - name: Audit frozen runtime dependencies
        env:
          EXCLUDE_PACKAGE: ${{ inputs.runtime-audit-exclude-package }}
          IGNORE_VULNERABILITIES: ${{ inputs.runtime-audit-ignore-vulnerabilities }}
        run: |
          set -euo pipefail
          requirements="$RUNNER_TEMP/runtime-requirements.txt"
          export_args=(--frozen --no-dev --no-emit-project --output-file "$requirements")
          if [[ -n "$EXCLUDE_PACKAGE" ]]; then
            export_args+=(--no-emit-package "$EXCLUDE_PACKAGE")
          fi
          uv export "${export_args[@]}"

          audit_args=(--requirement "$requirements" --no-deps --disable-pip)
          if [[ -n "$IGNORE_VULNERABILITIES" ]]; then
            read -r -a vulnerability_ids <<<"$IGNORE_VULNERABILITIES"
            for vulnerability_id in "${vulnerability_ids[@]}"; do
              audit_args+=(--ignore-vuln "$vulnerability_id")
            done
          fi
          uv run --frozen --no-sync pip-audit "${audit_args[@]}"

      - name: Build and inspect distributions
        run: |
          set -euo pipefail
          rm -rf build dist
          uv build --no-sources
          uv run --no-sync twine check dist/*
          uv run --no-sync check-wheel-contents dist/*.whl
          uv run --no-sync check-manifest

      - name: Install and import wheel and source distribution in isolation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          project_name="$(uv run --no-sync python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['name'])
          PY
          )"
          requirements="$RUNNER_TEMP/artifact-runtime-requirements.txt"
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --output-file "$requirements"
          for artifact in dist/*.whl dist/*.tar.gz; do
            environment="$RUNNER_TEMP/$(basename "$artifact" | tr '.-' '__')"
            uv venv --python "$PYTHON_VERSION" "$environment"
            uv pip sync --python "$environment/bin/python" "$requirements"
            uv pip install --python "$environment/bin/python" --no-deps "$artifact"
            "$environment/bin/python" - "$project_name" <<'PY'
          import importlib
          import importlib.metadata
          import sys

          project_name = sys.argv[1].lower().replace('_', '-')
          candidates = sorted(
              package
              for package, distributions in importlib.metadata.packages_distributions().items()
              if any(item.lower().replace('_', '-') == project_name for item in distributions)
          )
          if not candidates:
              raise SystemExit(f'no import package found for {project_name}')
          for package in candidates:
              importlib.import_module(package)
          print(','.join(candidates))
          PY
          done
