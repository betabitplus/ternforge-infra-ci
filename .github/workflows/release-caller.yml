name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@4525f371e73e9e7e24125faf6a63117835751a84 # v5.1.7
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
