name: EXP-0047 GitHub App token scope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-scope:
    name: prove exact GitHub App token scope
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run token-scope experiment
        uses: ./.github/actions/exp-0047
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
